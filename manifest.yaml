---
apiVersion: v1
kind: Namespace
metadata:
  name: elementar-rt-minimalistic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elementar-rt-minimalistic
  namespace: elementar-rt-minimalistic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elementar-rt-minimalistic
  template:
    metadata:
      labels:
        app: elementar-rt-minimalistic
    spec:
      containers:
        - name: elementar-rt-minimalistic
          image: registry.tulikas.de/elementar-rt-minimalistic:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: elementar-rt-minimalistic
  namespace: elementar-rt-minimalistic
spec:
  selector:
    app: elementar-rt-minimalistic
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elementar-rt-minimalistic
  namespace: elementar-rt-minimalistic
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-cache-key: "$scheme$request_method$host$request_uri"
    nginx.ingress.kubernetes.io/proxy-cache-use-stale: "error timeout updating http_500 http_502 http_503 http_504"
    nginx.ingress.kubernetes.io/proxy-cache-revalidate: "on"
    nginx.ingress.kubernetes.io/proxy-cache-bypass: "$http_cache_control"
    nginx.ingress.kubernetes.io/proxy-cache: "true"
    nginx.ingress.kubernetes.io/proxy-cache-valid: "200 302 10m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - minimalistic.elementar-rt.tulikas.de
      secretName: elementar-rt-minimalistic-tls
  rules:
    - host: minimalistic.elementar-rt.tulikas.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elementar-rt-minimalistic
                port:
                  number: 80
